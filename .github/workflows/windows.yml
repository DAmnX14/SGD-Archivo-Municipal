name: Windows - pruebas y ejecutable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verificar WIA / pywin32
        run: python -c "import scanner_utils as s; print(s.estado_escaner())"

      - name: Pruebas del sistema
        run: python -m pytest -v tests

      - name: Compilar ejecutable (PyInstaller)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name "SGD_Archivo_Municipal"
          --icon "static\img\logo_archivo.ico"
          --add-data "templates;templates" --add-data "static;static"
          --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32com.client
          --collect-data reportlab app.py

      - name: Autoprueba desde el código fuente
        shell: pwsh
        run: |
          $env:SGD_DATOS = Join-Path $env:RUNNER_TEMP "sgd_src"
          $p = Start-Process -FilePath python -ArgumentList "app.py","--autoprueba" -PassThru `
                -RedirectStandardError nativo_err.txt -RedirectStandardOutput nativo_out.txt
          $fin = $p.WaitForExit(150000)
          if (-not $fin) { $p.Kill() } else { Write-Host "Código de salida: $($p.ExitCode)" }
          Get-Content (Join-Path $env:SGD_DATOS "autoprueba.log") -ErrorAction SilentlyContinue | Select-Object -Last 120
          Write-Host "---- stderr nativo ----"; Get-Content nativo_err.txt -ErrorAction SilentlyContinue | Select-Object -Last 80
          Write-Host "---- stdout nativo ----"; Get-Content nativo_out.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          Write-Host "---- Visor de eventos (Application, errores recientes) ----"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
            Select-Object -First 6 | ForEach-Object { "[$($_.ProviderName)] $($_.Message)" }
          Write-Host "---- WebView2 Runtime ----"
          Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue | Select-Object pv, name
          pip show pywebview pythonnet | Select-String "Name|Version"
          $json = Join-Path $env:SGD_DATOS "autoprueba.json"
          if (-not $fin -or -not (Test-Path $json)) { throw "La autoprueba desde el código no terminó" }
          Get-Content $json -Raw
          if (-not (Get-Content $json -Raw | ConvertFrom-Json).ok) { throw "La autoprueba desde el código falló" }

      - name: Autoprueba del .exe (ventana WebView2 real)
        shell: pwsh
        run: |
          $env:SGD_DATOS = Join-Path $env:RUNNER_TEMP "sgd_datos"
          $p = Start-Process -FilePath "dist\SGD_Archivo_Municipal.exe" -ArgumentList "--autoprueba" -PassThru
          $fin = $p.WaitForExit(180000)
          if (-not $fin) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("pantalla_autoprueba.png")
            $p.Kill()
          }
          Get-Content (Join-Path $env:SGD_DATOS "autoprueba.log") -ErrorAction SilentlyContinue | Select-Object -Last 120
          $json = Join-Path $env:SGD_DATOS "autoprueba.json"
          if (-not $fin -or -not (Test-Path $json)) { throw "El ejecutable no completó la autoprueba" }
          Get-Content $json -Raw
          if (-not (Get-Content $json -Raw | ConvertFrom-Json).ok) { throw "La autoprueba de la interfaz falló" }
          Write-Host "PDF de ejemplo generados:" (Get-ChildItem (Join-Path $env:SGD_DATOS "repositorio_pdf") -Recurse -Filter *.pdf).Count

      - name: Guardar diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-autoprueba
          path: |
            pantalla_autoprueba.png
            ${{ runner.temp }}/sgd_datos/autoprueba.log
            ${{ runner.temp }}/sgd_src/autoprueba.log
          if-no-files-found: ignore

      - name: Publicar ejecutable como artefacto
        if: always() && hashFiles('dist/SGD_Archivo_Municipal.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SGD_Archivo_Municipal-exe
          path: dist/SGD_Archivo_Municipal.exe

      - name: Crear Release (sólo al etiquetar vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SGD_Archivo_Municipal.exe
